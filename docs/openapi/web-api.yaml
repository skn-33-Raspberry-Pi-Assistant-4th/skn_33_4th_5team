openapi: 3.0.3

info:
  title: PiCare Web API
  version: 1.0.0
  description: |
    PiCare Django 웹 서버의 JSON API 명세입니다.
    브라우저 세션과 CSRF 보호를 사용하는 API가 포함됩니다.

servers:
  - url: /
    description: PiCare Django 웹 서버

tags:
  - name: Health
    description: 웹 서버와 AI 서비스 준비 상태 확인
  - name: Command Lab
    description: 안전한 Raspberry Pi 명령어 분석과 조합
  - name: AI Job
    description: RunPod AI 작업 상태 조회 및 취소
  - name: Mini Challenge
    description: Q&A 기반 미니 챌린지 생성과 채점

paths:
  /health/:
    get:
      tags:
        - Health
      summary: 웹 서버와 AI 서비스 준비 상태를 조회합니다.
      operationId: getWebHealth
      responses:
        "200":
          description: 상태 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ready:
                  summary: AI 서비스 준비 완료
                  value:
                    status: ok
                    ready: true
                    message: RunPod AI 서비스가 준비되었습니다.
                notReady:
                  summary: AI 서비스 준비 중 또는 연결 실패
                  value:
                    status: not_ready
                    ready: false
                    message: RunPod AI 서비스를 준비하지 못했습니다. 설정을 확인해 주세요.

  /api/lab/templates:
    get:
      tags:
        - Command Lab
      summary: 승인된 명령어 템플릿 목록을 조회합니다.
      operationId: listCommandLabTemplates
      responses:
        "200":
          description: 템플릿 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandTemplateListResponse"
        "503":
          description: 명령어 실험실 데이터를 준비하지 못함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lab/analyze:
    post:
      tags:
        - Command Lab
      summary: 입력한 명령어를 분석합니다.
      description: |
        명령어를 실제로 실행하지 않습니다.
        승인된 명령어 템플릿과 안전 규칙을 기준으로 분석 결과만 반환합니다.
      operationId: analyzeCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandAnalyzeRequest"
            example:
              command: ssh pi@192.168.0.12
      responses:
        "200":
          description: 명령어 분석 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandLabResult"
        "400":
          description: 지원하지 않는 명령어 또는 유효하지 않은 입력
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 명령어 실험실을 일시적으로 사용할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/lab/compose:
    post:
      tags:
        - Command Lab
      summary: 템플릿과 입력값으로 명령어를 조합합니다.
      description: |
        명령어를 실제로 실행하지 않습니다.
        입력값을 검증한 뒤 표시용 결과만 반환합니다.
      operationId: composeCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandComposeRequest"
            example:
              template_id: cmd-networking-002
              values:
                part-02: tcp://camera.local:8554
              product_id: null
      responses:
        "200":
          description: 명령어 조합 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandLabResult"
        "400":
          description: 템플릿 또는 입력값이 유효하지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldErrorResponse"
        "503":
          description: 명령어 실험실을 일시적으로 사용할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/qa/mini-challenge:
    post:
      tags:
        - Mini Challenge
      summary: 미니 챌린지 생성을 요청합니다.
      description: |
        현재 브라우저 세션에 저장된 Q&A 답변과 근거를 바탕으로 퀴즈 생성을 요청합니다.
        먼저 같은 세션에서 Q&A를 진행해야 합니다.
        브라우저 세션 및 CSRF 보호가 적용됩니다.
      operationId: createMiniChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniChallengeStartRequest"
            example:
              max_questions: 3
      responses:
        "202":
          description: 퀴즈 생성 작업이 접수됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeQueuedResponse"
        "200":
          description: 퀴즈를 생성하기에 충분한 Q&A 근거가 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeInsufficientResponse"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"
        "404":
          description: 현재 세션에서 Q&A 답변을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"
        "409":
          description: 이미 퀴즈 생성 작업이 진행 중임
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"
        "503":
          description: 퀴즈 생성 작업을 접수할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"

  /api/qa/mini-challenge/jobs/{task_id}:
    get:
      tags:
        - Mini Challenge
      summary: 퀴즈 생성 상태를 조회합니다.
      description: 현재 브라우저 세션에서 요청한 퀴즈 생성 작업의 상태를 확인합니다.
      operationId: getMiniChallengeJob
      parameters:
        - name: task_id
          in: path
          required: true
          description: 생성 요청을 접수할 때 받은 작업 ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 작업이 완료됐거나 최종 상태임
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeJobStatusResponse"
        "202":
          description: 퀴즈 생성 작업 진행 중
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeJobStatusResponse"
        "404":
          description: 해당 세션에서 작업을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"

  /api/qa/mini-challenge/jobs/{task_id}/cancel:
    post:
      tags:
        - Mini Challenge
      summary: 퀴즈 생성을 취소합니다.
      description: 현재 브라우저 세션에서 요청한 퀴즈 생성 작업을 취소합니다.
      operationId: cancelMiniChallengeJob
      parameters:
        - name: task_id
          in: path
          required: true
          description: 취소할 작업 ID
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: 취소 완료 또는 취소 처리 중
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeCancelResponse"
        "404":
          description: 해당 세션에서 작업을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"
        "503":
          description: 취소 요청을 처리할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"

  /api/qa/mini-challenge/quizzes/{quiz_id}/submit:
    post:
      tags:
        - Mini Challenge
      summary: 퀴즈 답안을 제출합니다.
      description: |
        현재 브라우저 세션의 퀴즈에 답안을 제출하고 채점 결과를 받습니다.
        브라우저 세션 및 CSRF 보호가 적용됩니다.
      operationId: submitMiniChallengeAnswer
      parameters:
        - name: quiz_id
          in: path
          required: true
          description: 답안을 제출할 퀴즈 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniChallengeSubmitRequest"
            example:
              question_id: question-1
              selected_choice_id: B
      responses:
        "200":
          description: 답안 채점 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeSubmitResponse"
        "400":
          description: 요청 또는 답안 형식이 올바르지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"
        "404":
          description: 현재 세션에서 퀴즈를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"
        "409":
          description: 이미 제출된 답안
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniChallengeErrorResponse"


  /api/ai/jobs/{job_id}:
    get:
      tags:
        - AI Job
      summary: AI 작업 상태를 조회합니다.
      description: 현재 브라우저 세션에서 생성한 RunPod AI 작업의 상태와 결과를 확인합니다.
      operationId: getAiJob
      parameters:
        - name: job_id
          in: path
          required: true
          description: AI 작업 요청 시 받은 작업 ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 작업이 완료됐거나 최종 상태임
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobStatusResponse"
        "202":
          description: 작업이 대기 중이거나 진행 중임
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobStatusResponse"
        "404":
          description: 작업을 찾을 수 없거나 현재 세션의 작업이 아님
        "429":
          description: AI 작업 요청 한도 초과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobErrorResponse"
        "502":
          description: AI 서버의 응답 형식이 올바르지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobErrorResponse"
        "503":
          description: AI 서버에 연결할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobErrorResponse"

  /api/ai/jobs/{job_id}/cancel:
    post:
      tags:
        - AI Job
      summary: AI 작업을 취소합니다.
      description: 현재 브라우저 세션에서 생성한 대기 중 또는 실행 중인 AI 작업을 취소합니다.
      operationId: cancelAiJob
      parameters:
        - name: job_id
          in: path
          required: true
          description: 취소할 AI 작업 ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 작업 취소 완료 또는 이미 종료된 작업
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobStatusResponse"
        "202":
          description: 취소 요청 처리 중
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiJobStatusResponse"
        "404":
          description: 작업을 찾을 수 없거나 현재 세션의 작업이 아님

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - ready
        - message
      properties:
        status:
          type: string
          enum:
            - ok
            - not_ready
          example: ok
        ready:
          type: boolean
          example: true
        message:
          type: string
          example: RunPod AI 서비스가 준비되었습니다.

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: 명령어 실험실을 처리하지 못했습니다.

    FieldErrorResponse:
      type: object
      required:
        - error
        - field
      properties:
        error:
          type: string
          example: 포트 번호는 1~65535 범위여야 합니다.
        field:
          type: string
          example: part-02

    CommandAnalyzeRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          minLength: 1
          example: ssh pi@192.168.0.12

    CommandComposeRequest:
      type: object
      required:
        - template_id
        - values
      properties:
        template_id:
          type: string
          example: cmd-networking-002
        values:
          type: object
          additionalProperties:
            type: string
          example:
            part-02: tcp://camera.local:8554
        product_id:
          type: string
          nullable: true
          example: null

    CommandTemplateListResponse:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/CommandTemplate"

    CommandTemplate:
      type: object
      required:
        - template_id
        - topic
        - canonical_command
        - parts
        - editable_fields
        - execution_context
        - effect_ko
        - risk_level
        - risk_notice_ko
        - limitations_ko
      properties:
        template_id:
          type: string
          example: cmd-remote-access-004
        topic:
          type: string
          example: remote_access
        canonical_command:
          type: string
          example: ssh learner@raspberrypi.local
        parts:
          type: array
          items:
            type: object
            additionalProperties: true
        editable_fields:
          type: array
          items:
            type: object
            additionalProperties: true
        execution_context:
          type: string
          example: Raspberry Pi OS 터미널
        effect_ko:
          type: string
        risk_level:
          type: string
          example: low
        risk_notice_ko:
          type: string
        limitations_ko:
          type: string

    CommandLabResult:
      type: object
      required:
        - template_id
        - execution_policy
        - command
        - parts
        - effect_ko
        - execution_context
        - risk_level
        - risk_notice_ko
        - limitations_ko
        - evidence
        - values
      properties:
        template_id:
          type: string
          example: cmd-remote-access-004
        execution_policy:
          type: string
          enum:
            - display_only
          example: display_only
        command:
          type: string
          example: ssh pi@192.168.0.12
        parts:
          type: array
          items:
            type: object
            additionalProperties: true
        effect_ko:
          type: string
        execution_context:
          type: string
        risk_level:
          type: string
        risk_notice_ko:
          type: string
        limitations_ko:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceCard"
        product:
          type: object
          nullable: true
          additionalProperties: true
        values:
          type: object
          additionalProperties:
            type: string
        field_validation:
          type: array
          items:
            type: object
            additionalProperties: true
        validation_summary:
          type: object
          nullable: true
          additionalProperties: true

    EvidenceCard:
      type: object
      required:
        - chunk_id
        - title
        - section
        - url
      properties:
        chunk_id:
          type: string
        title:
          type: string
        section:
          type: string
        url:
          type: string
          format: uri

    MiniChallengeStartRequest:
      type: object
      properties:
        max_questions:
          type: integer
          enum:
            - 3
          default: 3
          description: 생성할 문제 수. 현재 3문제만 지원합니다.

    MiniChallengeQueuedResponse:
      type: object
      required:
        - task_id
        - status
      properties:
        task_id:
          type: string
          format: uuid
          description: 상태 조회 및 취소에 사용할 작업 ID
        status:
          type: string
          enum:
            - pending
          example: pending

    MiniChallengeInsufficientResponse:
      type: object
      required:
        - status
        - quiz
      properties:
        status:
          type: string
          enum:
            - insufficient_content
        quiz:
          type: object
          required:
            - status
            - questions
          properties:
            status:
              type: string
              enum:
                - insufficient_content
            questions:
              type: array
              items:
                type: object
              example: []

    MiniChallengeJobStatusResponse:
      type: object
      required:
        - task_id
        - status
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - cancelling
            - cancelled
            - generation_failed
            - insufficient_content
            - available
        quiz_id:
          type: string
          description: 퀴즈가 생성된 경우 제공되는 퀴즈 ID
        quiz:
          $ref: "#/components/schemas/MiniChallengePublicQuiz"
        error:
          type: object
          description: 작업 실패 시 제공될 수 있는 오류 정보
          properties:
            code:
              type: string
            message:
              type: string

    MiniChallengePublicQuiz:
      type: object
      required:
        - status
        - questions
      properties:
        status:
          type: string
          enum:
            - available
            - insufficient_content
            - generation_failed
        questions:
          type: array
          items:
            $ref: "#/components/schemas/MiniChallengePublicQuestion"

    MiniChallengePublicQuestion:
      type: object
      description: 퀴즈를 풀기 전에는 정답과 해설을 반환하지 않습니다.
      required:
        - question_id
        - question
        - choices
      properties:
        question_id:
          type: string
        question:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/MiniChallengeChoice"

    MiniChallengeChoice:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: string
          enum:
            - A
            - B
            - C
            - D
        text:
          type: string

    MiniChallengeCancelResponse:
      type: object
      required:
        - task_id
        - status
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - cancelled
            - cancelling

    MiniChallengeSubmitRequest:
      type: object
      required:
        - question_id
        - selected_choice_id
      properties:
        question_id:
          type: string
        selected_choice_id:
          type: string
          enum:
            - A
            - B
            - C
            - D

    MiniChallengeSubmitResponse:
      type: object
      description: 채점 결과와 근거 정보를 반환합니다. 구현에 따라 추가 필드가 포함될 수 있습니다.
      additionalProperties: true
      required:
        - question_id
        - selected_choice_id
        - correct_choice_id
        - is_correct
        - explanation
      properties:
        question_id:
          type: string
        selected_choice_id:
          type: string
          enum:
            - A
            - B
            - C
            - D
        correct_choice_id:
          type: string
          enum:
            - A
            - B
            - C
            - D
        is_correct:
          type: boolean
        explanation:
          type: string
        supporting_quotes:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceCard"
        authenticated:
          type: boolean
        feature:
          type: string
          example: challenge
        status:
          type: string
          example: incorrect

    MiniChallengeErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: 요청 형식이 올바르지 않습니다.

    AiJobStatusResponse:
      type: object
      required:
        - job_id
        - kind
        - status
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - qa
            - recommendation
            - quiz
        status:
          type: string
          enum:
            - queued
            - pending
            - running
            - cancelling
            - succeeded
            - failed
            - cancelled
            - expired
            - available
            - insufficient_content
            - generation_failed
        redirect_url:
          type: string
