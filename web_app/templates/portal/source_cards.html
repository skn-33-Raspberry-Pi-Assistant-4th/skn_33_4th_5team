<section class="sources-panel"><div class="section-heading"><div><p class="card-kicker mb-1">공식 문서</p><h2 class="h4 mb-0">출처 {{ source_cards|length }}건</h2></div></div>{% for source in source_cards %}<article class="source-card"><div class="source-card-top"><span class="source-icon">📄</span><a href="{{ source.url }}" target="_blank" rel="noopener">{{ source.citation_id }} · {{ source.title }} ↗</a></div><p>섹션: {{ source.section }}</p><p>태그: {{ source.tags }}</p><blockquote>{{ source.quote }}</blockquote></article>{% endfor %}</section>
