{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PiCare{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'portal/css/picare.css' %}">
</head>
<body>
  <header class="site-header border-bottom">
    <nav class="navbar navbar-expand-lg container py-3" aria-label="주요 메뉴">
      <a class="navbar-brand brand-mark" href="{% url 'about' %}">🍓 PiCare<span>.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNavigation">
        <ul class="navbar-nav nav-pills gap-lg-2 mt-3 mt-lg-0">
          <li class="nav-item"><a class="nav-link {% if active_page == 'about' %}active{% endif %}" href="{% url 'about' %}">서비스 소개</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'recommend' %}active{% endif %}" href="{% url 'recommend' %}">제품 추천</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'qa' %}active{% endif %}" href="{% url 'qa' %}">질의응답</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'lab' %}active{% endif %}" href="{% url 'lab' %}">명령어 실험실</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'challenge' %}active{% endif %}" href="{% url 'challenge' %}">미니 챌린지</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <main class="container page-shell py-4 py-lg-5">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">공식 Raspberry Pi 문서를 근거로 안내합니다.</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
