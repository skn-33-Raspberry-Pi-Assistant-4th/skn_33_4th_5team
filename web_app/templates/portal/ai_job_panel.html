{% if ai_job %}
<section class="lab-card form-card mt-3" id="aiJobPanel"
  data-status-url="{% url 'ai_job_status_api' ai_job.id %}"
  data-cancel-url="{% url 'ai_job_cancel_api' ai_job.id %}">
  <form hidden>{% csrf_token %}</form>
  <div class="d-flex align-items-center gap-2" role="status" aria-live="polite">
    <span class="spinner-border spinner-border-sm text-danger" id="aiJobSpinner" aria-hidden="true"></span>
    <strong id="aiJobMessage">AI 작업을 대기열에 등록했습니다.</strong>
  </div>
  <p class="text-muted small mb-2 mt-2">페이지를 열어 두면 완료된 결과로 자동 이동합니다.</p>
  <div class="progress mb-3" id="aiJobProgress" aria-label="AI 작업 진행 중">
    <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger w-100"></div>
  </div>
  <button class="btn btn-sm btn-outline-picare" id="aiJobCancel" type="button">생성 취소</button>
  <a class="btn btn-sm btn-outline-secondary" id="aiJobRetry" href="{{ request.path }}" hidden>다시 시도</a>
</section>
<script>
(() => {
  const panel = document.getElementById('aiJobPanel');
  if (!panel) return;
  const message = document.getElementById('aiJobMessage');
  const spinner = document.getElementById('aiJobSpinner');
  const progress = document.getElementById('aiJobProgress');
  const cancel = document.getElementById('aiJobCancel');
  const retry = document.getElementById('aiJobRetry');
  const csrf = panel.querySelector('[name=csrfmiddlewaretoken]').value;
  let stopped = false;
  let transientFailures = 0;

  const terminal = (text, canRetry = true) => {
    stopped = true;
    message.textContent = text;
    spinner.hidden = true;
    progress.hidden = true;
    cancel.hidden = true;
    retry.hidden = !canRetry;
  };
  const poll = async () => {
    if (stopped) return;
    try {
      const response = await fetch(panel.dataset.statusUrl, {credentials: 'same-origin'});
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error?.message || '상태를 확인하지 못했습니다.');
      transientFailures = 0;
      if (payload.status === 'succeeded' && payload.redirect_url) {
        window.location.assign(payload.redirect_url);
        return;
      }
      if (['queued', 'submission_unknown'].includes(payload.status)) message.textContent = 'AI 작업을 대기 중입니다.';
      else if (payload.status === 'running') message.textContent = '공식 문서를 확인하고 답변을 생성하고 있습니다.';
      else if (payload.status === 'cancelling') message.textContent = '생성 작업을 취소하고 있습니다.';
      else if (payload.status === 'cancelled') return terminal('생성 작업을 취소했습니다.');
      else if (payload.status === 'expired') return terminal('작업 시간이 만료되었습니다. 다시 요청해 주세요.');
      else if (payload.status === 'failed') return terminal(payload.error?.message || 'AI 작업을 완료하지 못했습니다.');
      window.setTimeout(poll, 1000);
    } catch (error) {
      transientFailures += 1;
      if (transientFailures < 4) return window.setTimeout(poll, 1500);
      terminal(error.message || 'AI 서버 연결을 확인하지 못했습니다.');
    }
  };
  cancel.addEventListener('click', async () => {
    cancel.disabled = true;
    message.textContent = '생성 작업을 취소하고 있습니다.';
    try {
      const response = await fetch(panel.dataset.cancelUrl, {
        method: 'POST', credentials: 'same-origin',
        headers: {'X-CSRFToken': csrf, 'Content-Type': 'application/json'}, body: '{}'
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error?.message || '취소하지 못했습니다.');
      if (payload.status === 'cancelled') terminal('생성 작업을 취소했습니다.');
      else window.setTimeout(poll, 500);
    } catch (error) {
      cancel.disabled = false;
      terminal(error.message || '취소 요청을 완료하지 못했습니다.');
    }
  });
  poll();
})();
</script>
{% endif %}
