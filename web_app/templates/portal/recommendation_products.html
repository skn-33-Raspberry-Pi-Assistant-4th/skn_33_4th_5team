{% if response.products %}
<div class="row g-4">
  {% for product in response.products %}
  <article class="col-md-6 col-xl-4">
    <div class="product-card h-100">
      {% if product.image_url %}<img src="{{ product.image_url }}" alt="{{ product.product_model }}" class="product-image">{% endif %}
      <h3>{{ product.product_model }}</h3>
      <p class="product-reason">{{ product.recommendation }}</p>
      <p class="small text-secondary mb-3">{{ product.limitations|join:' ' }}</p>
      <a href="{{ product.product_url }}" target="_blank" rel="noopener" class="btn btn-outline-picare w-100">자세히 보기 ↗</a>
      <small class="mt-3 text-muted">공식 근거 {{ product.citation_ids|join:', ' }}</small>
    </div>
  </article>
  {% endfor %}
</div>
{% endif %}
